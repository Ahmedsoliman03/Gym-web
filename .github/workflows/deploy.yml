name: Build & Deploy Web to Production

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/ahmedsoliman03/gym-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://backend:8000
            NEXT_PUBLIC_WS_URL=wss://gymspot.fit
            NEXT_PUBLIC_SITE_URL=https://gymspot.fit/platform
            NEXT_PUBLIC_SUPPORT_PHONE=201159133110
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=1084455359833-v9bc1a931lgqd2fjc6uco9gcd43t8u7l.apps.googleusercontent.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "=========================================="
            echo "==> 1. Pulling latest gym-web image..."
            echo "=========================================="
            cd /home/gymspot/gymspot || cd ~/gymspot
            docker compose pull gym-web

            echo "=========================================="
            echo "==> 2. Restarting gym-web container..."
            echo "=========================================="
            docker compose up -d --no-deps gym-web

            echo "=========================================="
            echo "==> 3. Cleaning unused images..."
            echo "=========================================="
            docker image prune -f

            echo "==> gym-web deployment completed successfully!"
